<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د. سعيد الصباغ | عيادة الأسنان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sage-3: #a7f3d0;
    --sage-4: #6ee7b7;
    --sage-5: #34d399;
    --teal-soft: #5eead4;
    --text-dark: #1e293b;
    --text-soft: #475569;
    --bg-main: linear-gradient(180deg, #f8fafc 0%, #ecfdf5 50%, #f0fdf4 100%);
    --card-trans: rgba(255, 255, 255, 0.95);
    --white: #ffffff;
    --mint-2: #dcfce7;
    --mint-3: #bbf7d0;
    --shadow: rgba(52, 211, 153, 0.15);
  }

  body.dark {
    --text-dark: #f1f5f9;
    --text-soft: #cbd5e1;
    --bg-main: linear-gradient(180deg, #0f172a 0%, #0a1f1c 50%, #0f2a1f 100%);
    --card-trans: rgba(30, 41, 59, 0.95);
    --white: #1e293b;
    --mint-2: #064e3b;
    --mint-3: #065f46;
    --shadow: rgba(0, 0, 0, 0.5);
  }

  html, body { overflow-x: hidden; }

  body {
    min-height: 100vh;
    font-family: 'Cairo', sans-serif;
    background: var(--bg-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 100px 20px 140px;
    color: var(--text-dark);
    transition: background 0.4s, color 0.4s;
  }

  body.lang-en { font-family: 'Poppins', sans-serif; direction: ltr; }

  /* شريط الأزرار العلوي */
  .top-bar {
    position: fixed;
    top: 20px; left: 20px; right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
  }

  .lang-toggle {
    display: flex;
    gap: 4px;
    background: var(--card-trans);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(167, 243, 208, 0.6);
    padding: 5px;
    border-radius: 50px;
    box-shadow: 0 4px 20px var(--shadow);
  }

  .lang-btn {
    background: transparent;
    border: none;
    color: var(--text-soft);
    padding: 8px 18px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
  }

  .lang-btn.active {
    background: linear-gradient(135deg, var(--sage-4), var(--sage-5));
    color: #fff;
    box-shadow: 0 4px 12px rgba(52, 211, 153, 0.4);
  }

  .theme-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--card-trans);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(167, 243, 208, 0.6);
    cursor: pointer;
    font-size: 22px;
    box-shadow: 0 4px 20px var(--shadow);
    transition: all 0.3s;
  }

  .theme-btn:hover { transform: scale(1.1); }

  /* الهيدر */
  .header {
    text-align: center;
    margin-bottom: 25px;
    z-index: 2;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--mint-3), var(--sage-4));
    box-shadow: 0 10px 30px rgba(52, 211, 153, 0.2);
    margin-bottom: 20px;
    animation: float 4s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-5px); }
  }

  .logo-badge::after { content: "🦷"; font-size: 48px; }

  .clinic-name {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--text-dark);
    margin-bottom: 6px;
  }

  .clinic-name span {
    background: linear-gradient(135deg, var(--sage-4), var(--sage-5));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .clinic-sub {
    font-size: 0.85rem;
    color: var(--sage-5);
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  body.dark .clinic-sub { color: var(--sage-4); }

  .tagline { font-size: 1rem; color: var(--text-soft); margin-top: 8px; }

  .one-time-badge {
    display: inline-block;
    background: var(--card-trans);
    border: 1px solid rgba(167, 243, 208, 0.8);
    color: var(--sage-5);
    padding: 7px 16px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 700;
    margin-top: 12px;
  }

  body.dark .one-time-badge { color: var(--sage-4); }

  /* العجلة */
  .wheel-wrapper {
    position: relative;
    width: 92vw;
    max-width: 480px;
    aspect-ratio: 1;
    margin: 25px 0 35px;
    z-index: 2;
  }

  .pointer {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 65px;
    z-index: 20;
    filter: drop-shadow(0 4px 12px rgba(52, 211, 153, 0.4));
  }

  .pointer svg { width: 100%; height: 100%; }

  .wheel-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--mint-2), var(--sage-3), var(--mint-3));
    padding: 14px;
    box-shadow: 
      0 20px 50px var(--shadow),
      0 0 0 3px var(--white),
      0 0 0 6px rgba(167, 243, 208, 0.6);
  }

  .wheel-inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    transition: transform 6s cubic-bezier(0.15, 0.9, 0.15, 1);
  }

  .spin-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 26%;
    height: 26%;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--sage-4), var(--sage-5));
    color: #fff;
    border: 5px solid #fff;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    z-index: 8;
    box-shadow: 0 8px 25px rgba(52, 211, 153, 0.4);
    transition: all 0.3s;
    font-family: inherit;
  }

  .spin-btn:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.08); }
  .spin-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.95); }
  .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* بطاقة النتيجة */
  .result-card {
    background: var(--card-trans);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(167, 243, 208, 0.6);
    padding: 25px 45px;
    border-radius: 22px;
    box-shadow: 0 15px 40px var(--shadow);
    text-align: center;
    min-width: 320px;
    max-width: 92vw;
    position: relative;
    overflow: hidden;
    z-index: 2;
  }

  .result-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--sage-4), var(--teal-soft), var(--sage-4), transparent);
  }

  .result-label {
    font-size: 0.8rem;
    color: var(--sage-5);
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  body.dark .result-label { color: var(--sage-4); }

  .prize-text {
    font-size: 2rem;
    font-weight: 900;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dark);
  }

  .prize-text.win {
    background: linear-gradient(135deg, var(--sage-5), var(--teal-soft));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .prize-text.lose { color: #94a3b8; font-size: 1.6rem; }
  .prize-text.pop { animation: pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); }

  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* الفوتر */
  .footer {
    margin-top: 40px;
    text-align: center;
    color: var(--text-soft);
    z-index: 2;
  }

  .footer strong { color: var(--sage-5); font-weight: 900; }
  body.dark .footer strong { color: var(--sage-4); }

  .phone-label {
    font-size: 0.9rem;
    color: var(--sage-5);
    font-weight: 700;
    margin: 10px 0 6px;
  }

  body.dark .phone-label { color: var(--sage-4); }

  .phone-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    background: linear-gradient(135deg, var(--sage-4), var(--sage-5));
    color: #fff !important;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 50px;
    font-weight: 900;
    font-size: 1.15rem;
    box-shadow: 0 8px 25px rgba(52, 211, 153, 0.35);
    transition: all 0.3s;
    direction: ltr;
    border: 1px solid rgba(255, 255, 255, 0.4);
  }

  .phone-link:hover { transform: translateY(-3px); }
  .phone-link svg { width: 20px; height: 20px; }

  /* الأزرار العائمة */
  .fab {
    position: fixed;
    bottom: 25px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 25px rgba(52, 211, 153, 0.4);
    z-index: 50;
    transition: transform 0.3s;
    text-decoration: none;
    border: 2px solid #fff;
  }

  .fab:hover { transform: scale(1.1); }

  .call-fab { left: 25px; background: linear-gradient(135deg, var(--sage-4), var(--sage-5)); }
  .call-fab svg { width: 26px; height: 26px; }
  .wa-fab { right: 25px; background: linear-gradient(135deg, #25d366, #128c7e); }
  .wa-fab svg { width: 30px; height: 30px; }

  /* المودال */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .modal-box {
    background: var(--card-trans);
    border-radius: 28px;
    padding: 45px 38px;
    text-align: center;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
    transform: scale(0.85);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(167, 243, 208, 0.5);
    color: var(--text-dark);
  }

  .modal-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--sage-4), var(--teal-soft), var(--sage-4));
  }

  .modal-overlay.show .modal-box { transform: scale(1); }

  .gift-icon {
    font-size: 75px;
    margin-bottom: 20px;
    animation: bounce 1.5s ease infinite alternate;
    display: inline-block;
  }

  @keyframes bounce {
    from { transform: translateY(0) rotate(-4deg); }
    to { transform: translateY(-10px) rotate(4deg); }
  }

  .modal-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 14px; }

  .modal-prize {
    font-size: 2.2rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--sage-5), var(--teal-soft));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 20px 0;
  }

  .modal-note {
    color: var(--text-soft);
    font-size: 0.95rem;
    line-height: 1.8;
    margin-bottom: 26px;
  }

  .modal-actions { display: flex; flex-direction: column; gap: 12px; }

  .modal-btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--sage-4), var(--sage-5));
    color: #fff;
    border: none;
    padding: 15px 32px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    box-shadow: 0 8px 25px rgba(52, 211, 153, 0.35);
    transition: all 0.3s;
  }

  .modal-btn-primary:hover { transform: translateY(-2px); }

  .modal-btn-secondary {
    background: transparent;
    color: var(--text-soft);
    border: 2px solid rgba(167, 243, 208, 0.8);
    padding: 13px 32px;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
  }

  .modal-btn-secondary:hover { 
    background: rgba(167, 243, 208, 0.2); 
    color: var(--sage-5);
  }

  .password-icon { font-size: 65px; margin-bottom: 18px; display: inline-block; }

  .password-input {
    width: 100%;
    padding: 16px 20px;
    font-size: 1.3rem;
    font-family: inherit;
    text-align: center;
    letter-spacing: 8px;
    border: 2px solid rgba(167, 243, 208, 0.8);
    border-radius: 15px;
    background: var(--card-trans);
    color: var(--text-dark);
    margin: 20px 0 10px;
    outline: none;
    transition: all 0.3s;
    direction: ltr;
    font-weight: 900;
  }

  .password-input:focus {
    border-color: var(--sage-4);
    box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.15);
  }

  .password-input.error { border-color: #ef4444; animation: shake 0.5s; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  .password-error {
    color: #ef4444;
    font-size: 0.9rem;
    font-weight: 700;
    min-height: 22px;
    margin-bottom: 15px;
  }

  .confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    pointer-events: none;
    z-index: 99;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(540deg);
      opacity: 0;
    }
  }

  @media (max-width: 480px) {
    body { padding: 90px 15px 130px; }
    .clinic-name { font-size: 1.7rem; }
    .prize-text { font-size: 1.6rem; }
    .modal-prize { font-size: 1.8rem; }
    .gift-icon { font-size: 60px; }
    .fab { width: 56px; height: 56px; }
    .fab svg { width: 22px; height: 22px; }
    .wa-fab svg { width: 26px; height: 26px; }
  }
</style>
</head>

          </svg>
          <span id="waBookText">احجز عبر واتساب</span>
        </a>
        <button class="modal-btn-secondary" id="closePrizeBtn">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- مودال الباسورد -->
  <div class="modal-overlay" id="passModal">
    <div class="modal-box">
      <div class="password-icon">🔒</div>
      <h2 class="modal-title" id="passTitle">كلمة المرور مطلوبة</h2>
      <p class="modal-note" id="passNote">لقد لعبت من قبل. اكتب كلمة المرور للعب مرة أخرى.</p>
      <input type="password" class="password-input" id="passInput" placeholder="• • • • • • • •" maxlength="10" inputmode="numeric">
      <div class="password-error" id="passError"></div>
      <div class="modal-actions">
        <button class="modal-btn-primary" id="passSubmit">تأكيد</button>
        <button class="modal-btn-secondary" id="passCancel">إلغاء</button>
      </div>
    </div>
  </div>

<script>
(function() {
  'use strict';

  // ============ الإعدادات ============
  const PASSWORD = '11223344';
  const STORAGE_KEY = 'dr_saeed_wheel_played_v4';
  const THEME_KEY = 'dr_saeed_theme_v4';
  const LANG_KEY = 'dr_saeed_lang_v4';

  // ============ الترجمات ============
  const T = {
    ar: {
      docName: 'سعيد الصباغ',
      tagline: '🌿 أدر العجلة واربح هديتك 🌿',
      oneTime: '⚠️ محاولة واحدة فقط لكل زائر',
      resultLabel: 'النتيجة',
      pressSpin: '— اضغط أدر العجلة —',
      spinBtn: 'أدر العجلة',
      playAgain: '🔒 العب مرة أخرى',
      spinning: '🎲 جاري الدوران...',
      yourLuck: '🎁 حظك كان: ',
      phoneLabel: '📞 للتواصل وللحجز',
      prizes: ['حظ أوفر', 'كشف مجاني', 'خصم 10%', 'هدية صغيرة', 'حظ أوفر', 'كشف مجاني', 'خصم 10%', 'هدية صغيرة'],
      wonTitle: 'مبروك! هديتك',
      wonNote: 'تم تسجيل هديتك. تواصل معنا عبر واتساب لاستلام الهدية.',
      loseTitle: 'حظ أوفر',
      loseNote: 'صحة أسنانك أهم من أي جائزة. تفضل بزيارتنا 💙',
      waBook: 'احجز عبر واتساب',
      closeBtn: 'إغلاق',
      passTitle: 'كلمة المرور مطلوبة',
      passNote: 'لقد لعبت من قبل. اكتب كلمة المرور للعب مرة أخرى.',
      passSubmit: 'تأكيد',
      passCancel: 'إلغاء',
      wrongPass: '❌ كلمة المرور غير صحيحة',
      correctPass: '✅ تم التحقق! جاري الدوران...'
    },
    en: {
      docName: 'Saeed Elsabbagh',
      tagline: '🌿 Spin the wheel and win 🌿',
      oneTime: '⚠️ One try only per visitor',
      resultLabel: 'RESULT',
      pressSpin: '— Press SPIN —',
      spinBtn: 'SPIN!',
      playAgain: '🔒 Play Again',
      spinning: '🎲 Spinning...',
      yourLuck: '🎁 Your luck: ',
      phoneLabel: '📞 Contact & Booking',
      prizes: ['Try Again', 'Free Exam', '10% OFF', 'Small Gift', 'Try Again', 'Free Exam', '10% OFF', 'Small Gift'],
      wonTitle: 'Congratulations!',
      wonNote: 'Your prize has been recorded. Contact us on WhatsApp to claim it.',
      loseTitle: 'Better Luck Next Time',
      loseNote: 'Your dental health matters most. Visit us 💙',
      waBook: 'Book via WhatsApp',
      closeBtn: 'Close',
      passTitle: 'Password Required',
      passNote: 'You played before. Enter the password to play again.',
      passSubmit: 'Confirm',
      passCancel: 'Cancel',
      wrongPass: '❌ Wrong password',
      correctPass: '✅ Verified! Spinning...'
    }
  };

  // ============ ألوان القطاعات ============
  const COLORS = [
    { color: '#f1f5f9', textColor: '#94a3b8', border: '#e2e8f0', win: false },
    { color: '#a7f3d0', textColor: '#065f46', border: '#6ee7b7', win: true  },
    { color: '#86efac', textColor: '#065f46', border: '#4ade80', win: true  },
    { color: '#5eead4', textColor: '#134e4a', border: '#2dd4bf', win: true  },
    { color: '#f1f5f9', textColor: '#94a3b8', border: '#e2e8f0', win: false },
    { color: '#a7f3d0', textColor: '#065f46', border: '#6ee7b7', win: true  },
    { color: '#86efac', textColor: '#065f46', border: '#4ade80', win: true  },
    { color: '#5eead4', textColor: '#134e4a', border: '#2dd4bf', win: true  }
  ];

  // ============ الحالة ============
  let currentLang = 'ar';
  let rotation = 0;
  let spinning = false;
  let hasPlayed = false;
  let lastPrizeIndex = -1;
  const N = 8;
  const arc = (2 * Math.PI) / N;

  // ============ عناصر DOM ============
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const prizeText = document.getElementById('prizeText');
  const prizeModal = document.getElementById('prizeModal');
  const passModal = document.getElementById('passModal');
  const passInput = document.getElementById('passInput');
  const passError = document.getElementById('passError');

  // ============ الوضع الداكن ============
  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch(e) {}
    if (saved === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeBtn').textContent = '☀️';
    }
  }

  document.getElementById('themeBtn').addEventListener('click', function() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    this.textContent = isDark ? '☀️' : '🌙';
    try { localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light'); } catch(e) {}
  });

  // ============ اللغة ============
  function setLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.body.classList.toggle('lang-en', lang === 'en');

    document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');

    const t = T[lang];
    document.getElementById('docName').textContent = t.docName;
    document.getElementById('tagline').textContent = t.tagline;
    document.getElementById('oneTimeBadge').textContent = t.oneTime;
    document.getElementById('resultLabel').textContent = t.resultLabel;
    document.getElementById('phoneLabel').textContent = t.phoneLabel;
    document.getElementById('waBookText').textContent = t.waBook;
    document.getElementById('closePrizeBtn').textContent = t.closeBtn;
    document.getElementById('passTitle').textContent = t.passTitle;
    document.getElementById('passNote').textContent = t.passNote;
    document.getElementById('passSubmit').textContent = t.passSubmit;
    document.getElementById('passCancel').textContent = t.passCancel;

    if (hasPlayed && lastPrizeIndex >= 0) {
      spinBtn.textContent = t.playAgain;
      prizeText.textContent = t.yourLuck + t.prizes[lastPrizeIndex];
    } else if (!spinning) {
      spinBtn.textContent = t.spinBtn;
      if (lastPrizeIndex < 0) prizeText.textContent = t.pressSpin;
    }

    try { localStorage.setItem(LANG_KEY, lang); } catch(e) {}

    drawWheel();
  }

  document.getElementById('btnAr').addEventListener('click', () => setLang('ar'));
  document.getElementById('btnEn').addEventListener('click', () => setLang('en'));

  // ============ حفظ / قراءة حالة اللعب ============
  function savePlayed(prizeIndex) {
    try { localStorage.setItem(STORAGE_KEY, String(prizeIndex)); } catch(e) {}
  }

  function loadPlayed() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null && saved !== undefined) {
        const idx = parseInt(saved, 10);
        if (!isNaN(idx) && idx >= 0 && idx < N) {
          hasPlayed = true;
          lastPrizeIndex = idx;
          return true;
        }
      }
    } catch(e) {}
    return false;
  }

  // ============ رسم العجلة ============
  function lighten(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.max(0, Math.min(255, (num >> 16) + amt));
    const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
    const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
    return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
  }

  function drawWheel() {
    const size = canvas.width;
    const c = size / 2;
    const r = c - 25;
    const texts = T[currentLang].prizes;

    ctx.clearRect(0, 0, size, size);

    ctx.beginPath();
    ctx.arc(c, c, r + 15, 0, 2 * Math.PI);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    for (let i = 0; i < N; i++) {
      const start = i * arc - Math.PI / 2;
      const end = start + arc;

      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, start, end);
      ctx.closePath();

      const gx = c + Math.cos(start + arc / 2) * r * 0.5;
      const gy = c + Math.sin(start + arc / 2) * r * 0.5;
      const grad = ctx.createRadialGradient(c, c, 0, gx, gy, r);
      grad.addColorStop(0, lighten(COLORS[i].color, 10));
      grad.addColorStop(1, COLORS[i].color);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.lineTo(c + Math.cos(start) * r, c + Math.sin(start) * r);
      ctx.strokeStyle = COLORS[i].border;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(start + arc / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = COLORS[i].textColor;
      ctx.font = '700 32px ' + (currentLang === 'ar' ? 'Cairo' : 'Poppins') + ', sans-serif';
      ctx.fillText(texts[i], r - 45, 0);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(c, c, r, 0, 2 * Math.PI);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 8;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(c, c, r - 6, 0, 2 * Math.PI);
    ctx.strokeStyle = '#a7f3d0';
    ctx.lineWidth = 2;
    ctx.stroke();

    for (let i = 0; i < N; i++) {
      const angle = i * arc - Math.PI / 2;
      const x = c + Math.cos(angle) * (r - 10);
      const y = c + Math.sin(angle) * (r - 10);
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#a7f3d0';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // ============================================
  // ✅ الدوران - بطريقة مضمونة 100%
  // ============================================
  function doSpin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = '...';
    prizeText.textContent = T[currentLang].spinning;
    prizeText.classList.remove('pop', 'win', 'lose');

    // ⭐ نختار الجائزة أولاً (عشوائي)
    const targetIndex = Math.floor(Math.random() * N);

    // ⭐ نحسب الزاوية اللي توصّل المؤشر على القطاع المختار
    // المؤشر فوق (-PI/2 في نظام العجلة)
    // القطاع targetIndex يمتد من (targetIndex * arc - PI/2) إلى ((targetIndex+1) * arc - PI/2)
    // مركز القطاع = targetIndex * arc + arc/2 - PI/2
    // عايزين الدوران rotation بحيث:
    // (rotation + centerAngle) mod 2PI = -PI/2 (المؤشر)

    const centerAngle = targetIndex * arc + arc / 2 - Math.PI / 2;
    
    // الزاوية المطلوبة:
    let targetRotation = -Math.PI / 2 - centerAngle;
    
    // نضيف لفات كاملة عشان الدوران يكون طويل
    const extraSpins = 7 + Math.floor(Math.random() * 3);
    targetRotation = targetRotation + extraSpins * 2 * Math.PI;
    
    // ضمان إن الدوران دايماً للأمام (أكبر من الدوران الحالي)
    while (targetRotation <= rotation) {
      targetRotation += 2 * Math.PI;
    }
    
    // إضافة عشوائية بسيطة عشان مايكونش في مركز القطاع بالظبط (يبان طبيعي)
    const jitter = (Math.random() - 0.5) * (arc * 0.6);
    targetRotation += jitter;

    rotation = targetRotation;
    canvas.style.transform = 'rotate(' + rotation + 'rad)';

    setTimeout(function() {
      // ⭐ النتيجة = القطاع اللي اخترناه
      lastPrizeIndex = targetIndex;
      const prizeName = T[currentLang].prizes[targetIndex];
      const isWin = COLORS[targetIndex].win;

      // ✅ عرض النتيجة في بطاقة النتيجة (نفس اللي العجلة وقفت عليه بالظبط)
      prizeText.textContent = prizeName;
      prizeText.classList.add('pop');
      prizeText.classList.add(isWin ? 'win' : 'lose');

      hasPlayed = true;
      savePlayed(targetIndex);

      if (isWin) {
        showPrizeModal(prizeName);
        playWinSound();
        launchConfetti();
      } else {
        showLoseModal();
      }

      spinBtn.textContent = T[currentLang].playAgain;
      spinBtn.disabled = false;
      spinning = false;
    }, 6300);
  }

  // ============ زر الدوران ============
  spinBtn.addEventListener('click', function() {
    if (spinning) return;
    if (hasPlayed) {
      openPassModal();
      return;
    }
    doSpin();
  });

  // ============ مودال الجائزة ============
  function showPrizeModal(prizeName) {
    document.getElementById('modalIcon').textContent = '🎁';
    document.getElementById('modalTitle').textContent = T[currentLang].wonTitle;
    document.getElementById('modalPrize').textContent = prizeName;
    document.getElementById('modalNote').textContent = T[currentLang].wonNote;
    prizeModal.classList.add('show');
  }

  function showLoseModal() {
    document.getElementById('modalIcon').textContent = '🌿';
    document.getElementById('modalTitle').textContent = T[currentLang].loseTitle;
    document.getElementById('modalPrize').textContent = '—';
    document.getElementById('modalNote').textContent = T[currentLang].loseNote;
    prizeModal.classList.add('show');
  }

  function closePrizeModal() { prizeModal.classList.remove('show'); }

  document.getElementById('closePrizeBtn').addEventListener('click', closePrizeModal);
  prizeModal.addEventListener('click', function(e) {
    if (e.target === prizeModal) closePrizeModal();
  });

  // ============ مودال الباسورد ============
  function openPassModal() {
    passInput.value = '';
    passError.textContent = '';
    passInput.classList.remove('error');
    passModal.classList.add('show');
    setTimeout(function() { passInput.focus(); }, 400);
  }

  function closePassModal() {
    passModal.classList.remove('show');
    passInput.value = '';
    passError.textContent = '';
    passInput.classList.remove('error');
  }

  function checkPassword() {
    const entered = passInput.value.trim();
    
    if (entered === PASSWORD) {
      passError.textContent = T[currentLang].correctPass;
      passError.style.color = '#10b981';
      
      setTimeout(function() {
        closePassModal();
        hasPlayed = false;
        try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
        doSpin();
      }, 700);
    } else {
      passError.textContent = T[currentLang].wrongPass;
      passError.style.color = '#ef4444';
      passInput.classList.add('error');
      setTimeout(function() { passInput.classList.remove('error'); }, 500);
    }
  }

  document.getElementById('passSubmit').addEventListener('click', checkPassword);
  document.getElementById('passCancel').addEventListener('click', closePassModal);

  passInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkPassword();
  });

  passModal.addEventListener('click', function(e) {
    if (e.target === passModal) closePassModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closePrizeModal();
      closePassModal();
    }
  });

  // ============ الصوت ============
  function playWinSound() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ac = new AC();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach(function(freq, i) {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t = ac.currentTime + i * 0.13;
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        osc.start(t);
        osc.stop(t + 0.45);
      });
    } catch(e) {}
  }

  // ============ كونفيتي ============
  function launchConfetti() {
    const colors = ['#a7f3d0', '#6ee7b7', '#4ade80', '#5eead4', '#ffffff', '#d1fae5'];
    for (let i = 0; i < 80; i++) {
      (function() {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-20px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width = (6 + Math.random() * 6) + 'px';
        el.style.height = (6 + Math.random() * 8) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.animationDuration = (3 + Math.random() * 2) + 's';
        el.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(el);
        setTimeout(function() { el.remove(); }, 5500);
      })();
    }
  }

  // ============ التهيئة ============
  function init() {
    initTheme();

    let savedLang = 'ar';
    try { savedLang = localStorage.getItem(LANG_KEY) || 'ar'; } catch(e) {}
    if (savedLang !== 'ar' && savedLang !== 'en') savedLang = 'ar';

    drawWheel();
    const playedBefore = loadPlayed();
    setLang(savedLang);

    if (playedBefore && lastPrizeIndex >= 0) {
      spinBtn.textContent = T[savedLang].playAgain;
      prizeText.textContent = T[savedLang].yourLuck + T[savedLang].prizes[lastPrizeIndex];
      prizeText.classList.add(COLORS[lastPrizeIndex].win ? 'win' : 'lose');
    }
  }

  init();
})();
</script>
